name: Daily Wallpaper Update

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Use Node 18 (canvas is stable here)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # ✅ Install system dependencies required by canvas
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev

      # ✅ Force canvas to build from source
      - name: Install npm dependencies
        run: npm install --build-from-source

      # ✅ Generate wallpaper images
      - name: Generate Wallpaper
        run: node generate-wallpaper.js

      # (Optional but helpful) Debug output
      - name: Verify generated files
        run: ls -lh wallpaper*.png

      # ✅ Commit and push only if changes exist
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull --no-rebase --no-edit

          git add wallpaper*.png
          git status

          git commit -m "Daily wallpaper update ($(date -u +'%Y-%m-%d'))" || echo "No changes to commit"
          git push
